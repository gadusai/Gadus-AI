name: Update pnpm lockfile

on:
  workflow_dispatch: {}

jobs:
  update-lockfile:
    name: Update pnpm-lock.yaml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Enable Corepack and activate pnpm@9
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Install dependencies and update lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Show git status
        run: |
          git status --porcelain

      - name: Commit and push lockfile changes
        env:
          GIT_AUTHOR_NAME: GitHub Actions
          GIT_AUTHOR_EMAIL: actions@github.com
        run: |
          if git status --porcelain | grep -q "pnpm-lock.yaml"; then
            git config user.name "$GIT_AUTHOR_NAME"
            git config user.email "$GIT_AUTHOR_EMAIL"
            git add pnpm-lock.yaml
            git commit -m "chore: update pnpm-lock.yaml to match overrides config"
            git push
          else
            echo "No changes to pnpm-lock.yaml"
          fi
